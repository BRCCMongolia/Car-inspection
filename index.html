<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BRCC Car</title>
<meta name="description" content="БНХТ (BRCC) · Машины өдөр тутмын үзлэг">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BRCC Car">
<meta name="theme-color" content="#1E5BC6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: one narrow phone column; blue app bar like the paper form's header band, cards only for vehicles */
:root{
  --brand:#0F6CBD; --brand-ink:#ffffff; --brand-deep:#0A4F8C; --bar:#0F6CBD; --bar-2:#0B5AA0; --leaf:#2E7D32; --tint:#E8F2FB;
  --bg:#F3F5F9; --surface:#ffffff; --fg:#141821; --muted:#5D6678; --line:#D8DDE7;
  --ok:#17804A; --ok-bg:#E3F4EA; --bad:#C2341F; --bad-bg:#FBE9E5; --warn:#9A6200; --warn-bg:#FFF3D6;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#2A7FCC; --brand-deep:#1B3E80; --bar:#0C4A86; --bar-2:#093A6B; --leaf:#3E9142; --tint:#14273B; --bg:#0F131A; --surface:#181E28; --fg:#E8ECF3; --muted:#9AA4B6; --line:#2C3443;
  --ok:#4CC584; --ok-bg:#15301F; --bad:#FF7B66; --bad-bg:#3A1A15; --warn:#F2B84B; --warn-bg:#352812; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#2A7FCC; --brand-deep:#1B3E80; --bar:#0C4A86; --bar-2:#093A6B; --leaf:#3E9142; --tint:#14273B; --bg:#0F131A; --surface:#181E28; --fg:#E8ECF3; --muted:#9AA4B6; --line:#2C3443;
  --ok:#4CC584; --ok-bg:#15301F; --bad:#FF7B66; --bad-bg:#3A1A15; --warn:#F2B84B; --warn-bg:#352812; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%;overflow-x:clip}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.bar{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--bar),var(--bar-2));color:var(--brand-ink);box-shadow:0 1px 0 rgba(0,0,0,.12);
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar img{width:40px;height:40px;border-radius:10px;flex:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.35)}
.bar h1{font-family:var(--font-display);font-size:17px;font-weight:700;margin:0;line-height:1.25;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{font-size:13px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .back{background:rgba(255,255,255,.14);border:0;color:inherit;font-size:22px;line-height:1;width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center}
main{max-width:560px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:none;padding:10px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.car{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.car-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.plate{display:inline-block;font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.06em;border:2px solid var(--fg);border-radius:6px;padding:2px 10px;background:var(--surface)}
.meta{color:var(--muted);font-size:14px;margin-top:6px}
.pill{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.todo{background:var(--warn-bg);color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:600;background:var(--brand);color:var(--brand-ink);min-height:48px}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:8px 12px;min-height:38px;font-size:14px}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.field .hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}
.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.err{color:var(--bad);font-size:13.5px;font-weight:500}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--brand)}
.notice{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:12px 14px;font-size:14px}
/* checklist */
.item{border-bottom:1px solid var(--line);padding-block:14px;display:flex;flex-direction:column;gap:10px}
.item:last-child{border-bottom:0}
.item-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.item-title{font-weight:500;min-width:0}
.item-title .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex:none;width:176px}
.seg button{border:0;background:var(--surface);padding:8px 4px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button.ok[aria-pressed="true"]{background:var(--ok);color:#fff}
.seg button.bad[aria-pressed="true"]{background:var(--bad);color:#fff}
.item.isbad{background:var(--bad-bg);margin-inline:-16px;padding-inline:16px}
.photo-btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--brand);border:1.5px dashed var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);cursor:pointer}
.photo-btn input{display:none}
.thumb{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.sticky-foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6;
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sticky-foot .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.sticky-foot .count{font-size:13.5px;color:var(--muted);flex:1;font-variant-numeric:tabular-nums}
.selfie-box{border:2px dashed var(--brand);border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;background:var(--surface)}
.selfie-box img{width:100%;max-width:340px;border-radius:12px;aspect-ratio:3/4;object-fit:cover}
.geo-line{margin:14px 2px 0;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.geo-line #geo[data-ok="1"]{color:var(--ok)}
.selfie-box svg{width:120px;height:auto}
.fuel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fuel button{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 0;font-weight:600;font-size:14px}
.fuel button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.fuel button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;font-size:12.5px;line-height:1.15}
.fuel .gauge{width:80%;height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:block}
.fuel .gauge i{display:block;height:100%}
.fuel button[aria-pressed="true"] .gauge{background:rgba(255,255,255,.35)}
.fuel-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.hist img{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none;background:var(--line)}
.hist .t{flex:1;min-width:0}
.hist .d{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.badlist{display:flex;flex-direction:column;gap:10px}
.badlist .b{background:var(--bad-bg);border-radius:10px;padding:10px 12px}
.badlist .b strong{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.title-edit{background:none;border:0;color:inherit;opacity:.8;font-size:13px;padding:0;text-decoration:underline}
@media (max-width:420px){.item-head{flex-direction:column;align-items:stretch}.seg{width:100%}.seg button{padding:10px 4px}.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.btn,.seg button{transition:background .15s,color .15s}}
.org{display:flex;gap:14px;align-items:center;border-radius:18px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--bar) 0%,var(--bar-2) 100%);box-shadow:0 6px 18px rgba(11,90,160,.18)}
.org .logo{background:#fff;border-radius:14px;padding:8px 10px;flex:none;display:flex;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.org .logo img{height:52px;width:auto;max-width:84px;object-fit:contain;display:block}
.org b{display:block;font-family:var(--font-display);font-size:14px;line-height:1.3;text-wrap:balance}
.org .en{display:block;font-size:12.5px;opacity:.85;margin-top:3px;line-height:1.3}
.org .motto{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:var(--leaf);color:#fff;font-weight:600;font-size:13px;padding:4px 11px 4px 9px;border-radius:99px;font-style:italic}
.org .motto::before{content:"";width:8px;height:8px;border-radius:50%;background:#B7E4B9;font-style:normal}
.state{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.state i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.state.done i{background:var(--muted)}
.actions{display:flex;flex-direction:column;gap:10px}
.actions .btn{display:flex;align-items:center;justify-content:center;gap:8px}
button.notice{width:100%;font:inherit;color:inherit;cursor:pointer}
</style>
</head>
<body>
<header class="bar"><div class="bar-in" id="bar"></div></header>
<main id="app"></main>
<div id="foot"></div>
<div class="toast" id="toast" hidden></div>

<script>
const ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#1490E3"/><g transform="translate(21.25 26) scale(1.15)" fill="#0B0D12"><rect x="5" y="0" width="40" height="14" rx="2.2"/><rect x="8" y="2.4" width="34" height="9" rx="1.8" fill="#1490E3"/><rect x="22.5" y="2.4" width="5" height="1.6"/><path d="M12,-0.7 C12,-4.6 16,-5.8 25,-5.8 C34,-5.8 38,-4.6 38,-0.7 Z"/><rect x="10" y="-0.9" width="30" height=".6" rx=".3"/><rect x="2.4" y="-0.2" width="1.8" height="18.4" rx=".5" stroke="#1490E3" stroke-width=".35"/><path d="M1.7,-2.6 L5.3,-2.6 C5.9,-2.6 6.1,-2.2 6.1,-1.6 L6.1,0.4 L1.7,0.4 Z"/><rect x="-1.2" y="8" width="3.4" height="4.2" rx=".8"/><rect x="2" y="9.4" width="3.2" height=".8"/><rect x="46.6" y="8" width="3.4" height="4.2" rx=".8"/><rect x="44.8" y="9.4" width="2" height=".8"/><rect x="-.5" y="31.5" width="9" height="16" rx="2.4" stroke="#1490E3" stroke-width=".45"/><rect x="41.5" y="31.5" width="9" height="16" rx="2.4" stroke="#1490E3" stroke-width=".45"/><path d="M1 37 l1.4 .7 M1 39.5 l1.4 .7 M1 42 l1.4 .7 M1 44.5 l1.4 .7 M49 37 l-1.4 .7 M49 39.5 l-1.4 .7 M49 42 l-1.4 .7 M49 44.5 l-1.4 .7 " fill="none" stroke="#1490E3" stroke-width=".6" stroke-linecap="round"/><path d="M4.6 37.5 l0.9 .5 l-0.9 .5 M4.6 41 l0.9 .5 l-0.9 .5 M4.6 44.5 l0.9 .5 l-0.9 .5 M45.4 37.5 l-0.9 .5 l0.9 .5 M45.4 41 l-0.9 .5 l0.9 .5 M45.4 44.5 l-0.9 .5 l0.9 .5 " fill="none" stroke="#1490E3" stroke-width=".5" stroke-linecap="round"/><path d="M4 17 Q4.6 13.4 8 13.2 L42 13.2 Q45.4 13.4 46 17 L45 27 L5 27 Z"/><path d="M5.6 16.4 Q6.4 14.8 8.6 14.7 L41.4 14.7 Q43.6 14.8 44.4 16.4" fill="none" stroke="#1490E3" stroke-width=".5"/><path d="M-1.8 27 L-1.2 20.2 Q-1 18.4 1.2 18.3 L6.6 18 L7 27 Z" stroke="#1490E3" stroke-width=".5"/><path d="M51.8 27 L51.2 20.2 Q51 18.4 48.8 18.3 L43.4 18 L43 27 Z" stroke="#1490E3" stroke-width=".5"/><path d="M-.6 20.6 Q-.4 19.5 1.3 19.4 L5.8 19.2 M50.6 20.6 Q50.4 19.5 48.7 19.4 L44.2 19.2" fill="none" stroke="#1490E3" stroke-width=".4"/><circle cx="11" cy="21.4" r="3.6" fill="#1490E3"/><circle cx="11" cy="21.4" r="3"/><circle cx="11" cy="21.4" r="2.25" fill="#1490E3"/><circle cx="39" cy="21.4" r="3.6" fill="#1490E3"/><circle cx="39" cy="21.4" r="3"/><circle cx="39" cy="21.4" r="2.25" fill="#1490E3"/><path d="M9.6 20.4 Q10.1 19.5 11.2 19.4 M37.6 20.4 Q38.1 19.5 39.2 19.4" fill="none" stroke="#0B0D12" stroke-width=".5" stroke-linecap="round"/><circle cx="11" cy="25.6" r=".8" fill="none" stroke="#1490E3" stroke-width=".45"/><circle cx="39" cy="25.6" r=".8" fill="none" stroke="#1490E3" stroke-width=".45"/><rect x="15.60" y="18.6" width="1.75" height="9.4" rx=".85" fill="#1490E3"/><rect x="18.35" y="18.6" width="1.75" height="9.4" rx=".85" fill="#1490E3"/><rect x="21.10" y="18.6" width="1.75" height="9.4" rx=".85" fill="#1490E3"/><rect x="23.85" y="18.6" width="1.75" height="9.4" rx=".85" fill="#1490E3"/><rect x="26.60" y="18.6" width="1.75" height="9.4" rx=".85" fill="#1490E3"/><rect x="29.35" y="18.6" width="1.75" height="9.4" rx=".85" fill="#1490E3"/><rect x="32.10" y="18.6" width="1.75" height="9.4" rx=".85" fill="#1490E3"/><path d="M12.6 27.6 L14.4 20.6 Q15.2 18.6 17.4 18.6 L32.6 18.6 Q34.8 18.6 35.6 20.6 L37.4 27.6" fill="none" stroke="#1490E3" stroke-width="3" stroke-linejoin="round"/><path d="M12.6 27.6 L14.4 20.6 Q15.2 18.6 17.4 18.6 L32.6 18.6 Q34.8 18.6 35.6 20.6 L37.4 27.6" fill="none" stroke="#0B0D12" stroke-width="1.8" stroke-linejoin="round"/><rect x="22.6" y="17.8" width="4.8" height="1.4" rx=".3" fill="#1490E3"/><rect x="21.4" y="24.8" width="7.2" height="3.6" rx=".6" stroke="#1490E3" stroke-width=".45"/><path d="M23 26.6 L27 26.6" stroke="#1490E3" stroke-width=".45"/><path d="M-1.5 28 L51.5 28 L50.6 34.2 L-.6 34.2 Z" stroke="#1490E3" stroke-width=".5"/><path d="M-.4 29.4 L13 29.4 M37 29.4 L50.4 29.4" stroke="#1490E3" stroke-width=".35"/><circle cx="5.8" cy="31.6" r="1.35" fill="none" stroke="#1490E3" stroke-width=".55"/><circle cx="44.2" cy="31.6" r="1.35" fill="none" stroke="#1490E3" stroke-width=".55"/><rect x="17" y="31.6" width="16" height="3.4" rx=".4" stroke="#1490E3" stroke-width=".5"/></g></svg>`;
const BRCC_LOGO = 'img/brcc.png';
const ICON = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ICON_SVG);

/* ---- Checklist: items 2–18 from the paper form (radio station removed); "suggest" = new proposals ---- */
const ITEMS = [
  {id:'brake', t:'Ажлын ба зогсоолын тормоз'},
  {id:'lights', t:'Гэрэл, дохио'},
  {id:'glass', t:'Цонх, урд шил, толь'},
  {id:'steer', t:'Жолоодлогын механизм'},
  {id:'belts', t:'Суудлын бүсний тоо, ажиллагаа'},
  {id:'horn', t:'Дуут дохио'},
  {id:'fire', t:'Галын хор'},
  {id:'fluids', t:'Шингэний түвшин'},
  {id:'wheels', t:'Дугуйнуудын байдал, шилька боолтууд'},
  {id:'wipers', t:'Шил арчигч'},
  {id:'ac', t:'Айр кондишн, паар'},
  {id:'damage', t:'Бохирдол, гэмтэл'},
  {id:'dash', t:'Хянах самбарын ажиллагаа'},
  {id:'chocks', t:'Дугуйны ивүүр байгаа эсэх'},
  {id:'firstaid', t:'Анхны тусламжийн иж бүрдэл'},
  {id:'pressure', t:'Дугуйн хийн даралт', suggest:true},
  {id:'spare', t:'Сэлбэг дугуй, домкрат, баллон түлхүүр', suggest:true},
  {id:'leaks', t:'Тос, шингэн дусалж байгаа эсэх (машин доор)', suggest:true},
  {id:'triangle', t:'Аюулын гурвалжин тэмдэг', suggest:true},
  {id:'docs', t:'Бичиг баримт (гэрчилгээ, даатгал, оношлогоо)', suggest:true},
  {id:'winter', t:'Чирэх трос, өвлийн хэрэгсэл', suggest:true},
];
const FUEL = ['¼-с бага','¼','½','¾','Дүүрэн'];

/* ---- storage (this device only) ---- */
const K = {cars:'vi.cars', insp:'vi.inspections', name:'vi.name', seeded:'vi.seeded', surveys:'vi.surveys'};
function load(k, d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true;}catch(e){ toast('Төхөөрөмжийн санах ой дүүрлээ. Хуучин үзлэгийн түүхээс устгана уу.'); return false;} }
let cars = load(K.cars, []);
let inspections = load(K.insp, []);
let surveys = load(K.surveys, null);
if (!surveys){ surveys=[]; save(K.surveys,surveys); }
if (!load('vi.clean1',false)){ // remove the example car and the auto-created sample survey (users start their own)
  const s1=surveys.find(s=>s.id==='s1' && /^Хулан хүзүүвчлэх \d{4}$/.test(s.name));
  if(s1){ surveys=surveys.filter(s=>s!==s1); inspections=inspections.filter(i=>i.surveyId!=='s1'); }
  cars=cars.filter(c=>c.id!=='ex1'); surveys.forEach(s=>s.carIds=s.carIds.filter(id=>id!=='ex1'));
  inspections=inspections.filter(i=>i.carId!=='ex1');
  save(K.cars,cars); save(K.surveys,surveys); save(K.insp,inspections); save('vi.clean1',true);
}

/* ---- BRCC fleet: pre-registered on every phone (added once by plate; later edits on the phone are kept) ---- */
const FLEET = [
  {id:'f9499', plate:'9499 УАА', make:'Jeep', model:'Wrangler', year:'2017', color:'Цэнхэр', driver:'Ш.Ойнбаяр', was:'Ойнбаяр'},
  {id:'f4849', plate:'4849 УЕВ', make:'Toyota', model:'Land Cruiser 200', year:'2017', color:'Хар', driver:'Н.Дархантөгс', was:'Дархантөгс'},
  {id:'f2845', plate:'2845 УНК', make:'Toyota', model:'Land Cruiser 70', year:'2006', color:'Цагаан', driver:'С.Ганболд', was:'Ганболд'},
  {id:'f0061', plate:'0061 ӨМЕ', make:'Nissan', model:'Patrol Y61', year:'2023', color:'Цагаан', driver:'Ч.Батсүх', was:'Батсүх'},
];
(function(){ const done=load('vi.fleet',[]); const norm=p=>String(p||'').replace(/\s+/g,'').toUpperCase(); let ch=false;
  for(const f of FLEET){ if(done.includes(f.id)) continue; if(!cars.some(c=>norm(c.plate)===norm(f.plate))){ const {was,...car}=f; cars.push(car); } done.push(f.id); ch=true; }
  for(const f of FLEET){ const c=cars.find(x=>x.id===f.id); if(c && f.was && c.driver===f.was){ c.driver=f.driver; ch=true; } } // name format update (Овгийн үсэг.Нэр)
  if(!load('vi.restore1',false)){ // 2026-11-05: судалгаанаас хасах гэж бүртгэлээс устгагдсан машиныг сэргээнэ
    for(const f of FLEET){ if(!cars.some(c=>c.id===f.id||norm(c.plate)===norm(f.plate))){ const {was,...car}=f; cars.push(car); ch=true;
      surveys.forEach(s=>{ if(!s.carIds.includes(f.id) && inspections.some(i=>i.surveyId===s.id&&i.carId===f.id)) s.carIds.push(f.id); }); } }
    save('vi.restore1',true); save(K.surveys,surveys); }
  if(ch){ save(K.cars,cars); save('vi.fleet',done); } })();

/* ---- helpers ---- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dayKey = d => { const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
const fmt = d => { const x=new Date(d); return `${x.getFullYear()}.${String(x.getMonth()+1).padStart(2,'0')}.${String(x.getDate()).padStart(2,'0')} ${String(x.getHours()).padStart(2,'0')}:${String(x.getMinutes()).padStart(2,'0')}`; };
const dfmt = k => k ? k.replace(/-/g,'.') : '';
const DAYS=['Ням','Даваа','Мягмар','Лхагва','Пүрэв','Баасан','Бямба'];
const surveyOf = id => surveys.find(s=>s.id===id);
const todayInsp = (carId, sid) => inspections.find(i=>i.carId===carId && i.surveyId===sid && dayKey(i.at)===dayKey(Date.now()));
const surveyCars = s => s.carIds.map(id=>cars.find(c=>c.id===id)).filter(Boolean);
const dateRange = s => `${dfmt(s.start)||'…'} – ${s.end?dfmt(s.end):'одоо'}`;
function surveyState(s){ return s.end ? 'done' : 'active'; }
const stateTag = s => surveyState(s)==='done' ? `<span class="state done"><i></i>Дууссан</span>` : `<span class="state"><i></i>Явагдаж байна</span>`;
(function(){ if(load('vi.mig2',false)) return; const t=dayKey(Date.now()); // dates are now automatic: start = created, end = when "Судалгаа дууссан" is pressed
  for(const s of surveys){ if(!s.start){ const d=inspections.filter(i=>i.surveyId===s.id).map(i=>dayKey(i.at)).sort()[0]; s.start=d||t; } if(s.end && s.end>=t) s.end=''; }
  save(K.surveys,surveys); save('vi.mig2',true); })();
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3200); }
function compress(file, max=720, q=.72){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=rej; r.onload=()=>{ const img=new Image(); img.onerror=rej; img.onload=()=>{
    const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); }; img.src=r.result; }; r.readAsDataURL(file); });
}

/* ---- router ---- */
let view = {name:'home', tab:'surveys'};
function go(v){ view=v; render(); window.scrollTo(0,0); }
const toSurvey = (sid, tab='cars') => go(sid&&surveyOf(sid) ? {name:'survey', id:sid, tab} : {name:'home', tab:'surveys'});

function bar(title, sub, back){
  $('#bar').innerHTML = (back?`<button class="back" id="backBtn" aria-label="Буцах">←</button>`:`<img src="${ICON}" alt="">`)+
    `<div style="min-width:0"><h1>${esc(title)}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
  if(back) $('#backBtn').onclick=back;
}
function foot(html){ $('#foot').innerHTML = html?`<div class="sticky-foot"><div class="in">${html}</div></div>`:''; }

function render(){
  ({home:renderHome, survey:renderSurvey, surveyForm:renderSurveyForm, carForm:renderCarForm, inspect:renderInspect, detail:renderDetail})[view.name]();
}
function carMeta(c){ return `${esc([c.make,c.model].filter(Boolean).join(' '))}${c.year?' · '+esc(c.year):''}${c.color?' · '+esc(c.color):''}<br>Жолооч: ${esc(c.driver||'—')}`; }
function bindCommon(){
  document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>go({name:'detail',id:b.dataset.detail}));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>go({name:'carForm',id:b.dataset.edit, back:view}));
}
function histRow(i){ const bad=i.items.filter(x=>x.s==='bad').length;
  return `<button class="hist" data-detail="${i.id}"><img src="${i.selfie||''}" alt=""><div class="t"><span class="plate" style="font-size:14px;padding:0 6px">${esc(i.plate)}</span>
    <div class="d">${fmt(i.at)} · ${esc(i.driver)}</div></div>${bad?`<span class="pill bad">${bad} хэвийн бус</span>`:`<span class="pill ok">Хэвийн</span>`}</button>`; }

/* ---- home: surveys + vehicle registry ---- */
function renderHome(){
  const now=new Date();
  bar('BRCC Car', `${DAYS[now.getDay()]}, ${fmt(now).slice(0,10)}`);
  let h=`<section class="org" aria-label="Байгууллага"><div class="logo"><img src="${BRCC_LOGO}" alt="BRCC лого"></div><div style="min-width:0"><b>Биологийн Нөөцийг Хамгаалах Төв</b><span class="en">Biological Resources Conservation Center</span><span class="motto">Хамтдаа оршихуй!</span></div></section>
  ${syncBanner()}
  <div class="tabs" role="tablist" style="grid-template-columns:1fr 1fr 1fr">
    <button role="tab" aria-selected="${view.tab==='surveys'}" data-tab="surveys">Судалгаа</button>
    <button role="tab" aria-selected="${view.tab==='cars'}" data-tab="cars">Машинууд</button>
    <button role="tab" aria-selected="${view.tab==='settings'}" data-tab="settings">Тохиргоо</button></div>`;
  if(view.tab==='surveys'){
    if(!surveys.length) h+=`<div class="empty">Судалгаа үүсгээгүй байна.<br>Доорх товчоор эхний судалгаагаа нэмнэ үү.</div>`;
    const order={active:0,soon:1,done:2};
    for(const s of [...surveys].sort((a,b)=>order[surveyState(a)]-order[surveyState(b)])){
      const sc=surveyCars(s); const done=sc.filter(c=>todayInsp(c.id,s.id)).length; const st=surveyState(s);
      const pill = st==='done'?`<span class="pill" style="background:var(--line);color:var(--muted)">Дууссан</span>`: st==='soon'?`<span class="pill todo">Эхлээгүй</span>`:
        (sc.length&&done===sc.length?`<span class="pill ok">Өнөөдөр ${done}/${sc.length}</span>`:`<span class="pill todo">Өнөөдөр ${done}/${sc.length}</span>`);
      h+=`<article class="car"><div class="car-top"><div style="min-width:0"><div style="font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.25">${esc(s.name)}</div>
        <div class="meta">${stateTag(s)}<br>${dateRange(s)} · ${sc.length} машин · ${inspections.filter(i=>i.surveyId===s.id).length} үзлэг</div></div>${st==='done'?'':pill}</div>
        <button class="btn" data-open="${s.id}">Нээх</button></article>`;
    }
    foot(`<button class="btn wide" id="addSurvey">+ Судалгаа нэмэх</button>`);
  } else if(view.tab==='settings'){
    h+=renderSettings(); foot('');
  } else {
    h+=`<div class="notice">Энд бүртгэсэн машинаа аль ч судалгаанд дахин бичилгүй сонгож нэмнэ.</div>`;
    if(!cars.length) h+=`<div class="empty">Бүртгэлтэй машин алга.</div>`;
    for(const c of cars){
      const n=surveys.filter(s=>s.carIds.includes(c.id)).length;
      h+=`<article class="car"><div class="car-top"><div style="min-width:0"><span class="plate">${esc(c.plate)}</span>${c.example?'<span class="tag">Жишээ</span>':''}
        <div class="meta">${carMeta(c)}</div></div><span class="pill" style="background:var(--line);color:var(--muted)">${n} судалгаа</span></div>
        <button class="btn ghost small" data-edit="${c.id}">Засах</button></article>`;
    }
    foot(`<button class="btn wide" id="addCar">+ Машин нэмэх</button>`);
  }
  $('#app').innerHTML=h;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go({name:'home',tab:b.dataset.tab}));
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>toSurvey(b.dataset.open));
  bindCommon();
  const as=$('#addSurvey'); if(as) as.onclick=()=>go({name:'surveyForm'});
  const ac=$('#addCar'); if(ac) ac.onclick=()=>go({name:'carForm', back:view});
  if(view.tab==='settings') bindSettings();
}

/* ---- one survey: today's cars, history, summary ---- */
function renderSurvey(){
  const s=surveyOf(view.id); if(!s) return go({name:'home',tab:'surveys'});
  bar(s.name, `${dateRange(s)} · <button class="title-edit" id="editS">засах</button>`, ()=>go({name:'home',tab:'surveys'}));
  $('#editS').onclick=()=>go({name:'surveyForm', id:s.id});
  const sc=surveyCars(s); const list=inspections.filter(i=>i.surveyId===s.id).sort((a,b)=>b.at-a.at);
  const st=surveyState(s);
  let h=`<div class="tabs" role="tablist" style="grid-template-columns:1fr 1fr 1fr">
    <button role="tab" aria-selected="${view.tab==='cars'}" data-tab="cars">Өнөөдөр</button>
    <button role="tab" aria-selected="${view.tab==='hist'}" data-tab="hist">Түүх</button>
    <button role="tab" aria-selected="${view.tab==='sum'}" data-tab="sum">Тойм</button></div>`;
  if(view.tab==='cars'){
    const done=sc.filter(c=>todayInsp(c.id,s.id)).length;
    if(st==='done') h+=`<div class="notice" style="border-left-color:var(--muted)">Энэ судалгаа <b>${dfmt(s.end)}</b>-нд дууссан. Шинэ үзлэг хийхгүй. Өгөгдлөө “Тойм” хэсгээс ZIP-ээр авна.</div>`;
    else if(sc.length) h+=`<div class="notice">Өнөөдөр <b>${done} / ${sc.length}</b> машин үзлэг хийгдсэн. Машинаа сонгоод үзлэгээ эхлүүлнэ үү.</div>`;
    else h+=`<div class="empty">Энэ судалгаанд машин нэмээгүй байна.<br>Доорх товчоор машинаа сонгоно уу.</div>`;
    for(const c of sc){
      const t=todayInsp(c.id,s.id); const bad=t?t.items.filter(i=>i.s==='bad').length:0;
      const pill = st==='done' ? '' : !t?`<span class="pill todo">Өнөөдөр үзээгүй</span>`: bad?`<span class="pill bad">${bad} хэвийн бус</span>`:`<span class="pill ok">Үзсэн · хэвийн</span>`;
      h+=`<article class="car"><div class="car-top"><div style="min-width:0"><span class="plate">${esc(c.plate)}</span>${c.example?'<span class="tag">Жишээ</span>':''}
        <div class="meta">${carMeta(c)}</div></div>${pill}</div>
        ${st==='done'?'':`<div class="row"><button class="btn" style="flex:1" data-start="${c.id}">${t?'Дахин үзлэг хийх':'Үзлэг эхлүүлэх'}</button>
        <button class="btn ghost small" data-edit="${c.id}">Засах</button></div>`}</article>`;
    }
    const n=list.length;
    h+=`<p id="zipMsg" class="notice" hidden style="margin-top:12px"></p>`;
    foot(`${st==='done'?'':`<button class="btn ghost" id="pickCars" style="background:var(--surface);flex:1;padding-left:10px;padding-right:10px">🚙 Машинууд</button>`}
      <button class="btn" id="sendAll" style="flex:1.3" ${n?'':'disabled'}>✉️ Бүх датаг илгээх</button>`);
  } else if(view.tab==='hist'){
    if(!list.length) h+=`<div class="empty">Энэ судалгаанд үзлэг хийгдээгүй байна.</div>`;
    let last='';
    for(const i of list){ const k=dayKey(i.at); if(k!==last){ last=k; const x=new Date(i.at); h+=`<h2>${DAYS[x.getDay()]} · ${dfmt(k)}</h2>`; } h+=histRow(i); }
    foot('');
  } else {
    const days=[...new Set(list.map(i=>dayKey(i.at)))].sort();
    const first=s.start||days[0]||dayKey(Date.now());
    const lastDay=[s.end,dayKey(Date.now())].filter(Boolean).sort()[0];
    const span=Math.max(1, Math.round((new Date(lastDay)-new Date(first))/864e5)+1);
    h+=`<div class="notice">${dfmt(first)} – ${dfmt(lastDay)} хооронд <b>${span}</b> өдөр. Машин бүр хэдэн өдөр үзлэг хийснийг харуулж байна.</div><div class="form" style="gap:0;padding-block:4px">`;
    if(!sc.length) h+=`<div style="padding:12px 0;color:var(--muted)">Машин алга.</div>`;
    for(const c of sc){
      const mine=list.filter(i=>i.carId===c.id); const d=new Set(mine.map(i=>dayKey(i.at))).size; const bad=mine.reduce((n,i)=>n+i.items.filter(x=>x.s==='bad').length,0);
      const pct=Math.min(100,Math.round(d/span*100));
      h+=`<div class="item" style="gap:8px"><div class="item-head" style="flex-direction:row;align-items:center"><span class="plate" style="font-size:14px;padding:0 6px">${esc(c.plate)}</span>
        <span style="font-variant-numeric:tabular-nums;font-weight:600">${d} / ${span} өдөр</span></div>
        <div style="height:8px;border-radius:4px;background:var(--line);overflow:hidden"><div style="height:100%;width:${pct}%;background:${pct>=100?'var(--ok)':'var(--brand)'}"></div></div>
        <div class="d" style="font-size:13.5px;color:var(--muted)">${esc(c.driver||'')}${span-d>0?` · ${span-d} өдөр алгассан`:''}${bad?` · <span style="color:var(--bad)">${bad} хэвийн бус тэмдэглэл</span>`:''}</div></div>`;
    }
    h+='</div>';
    const n=list.length;
    h+=`<h2>Өгөгдөл авах</h2><div class="form actions">
      <div style="font-size:14px;color:var(--muted)">${n} үзлэг · Excel хүснэгт (CSV), тайлан, селфи ба гэмтлийн зураг нэг ZIP файлд.</div>
      <button class="btn" id="zipMail" ${n?'':'disabled'}>✉️ ZIP-ийг имэйлээр илгээх</button>
      <button class="btn ghost" id="zipShare" ${n?'':'disabled'}>⬇️ ZIP утсанд хадгалах / хуваалцах</button>
      <div class="err" id="zipMsg" hidden></div></div>`;
    h+=`<div id="finZone"></div><div id="delSZone" style="margin-top:28px;text-align:center"><button class="btn ghost small" id="delSurvey" style="color:var(--bad)">🗑 Судалгааг устгах</button></div>`;
    foot(st==='done'?`<button class="btn wide ghost" id="reopen" style="background:var(--surface)">Судалгааг дахин нээх</button>`:`<button class="btn wide" id="finish" style="background:var(--leaf)">✓ Судалгаа дууссан</button>`);
  }
  $('#app').innerHTML=h;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>toSurvey(s.id,b.dataset.tab));
  const zm=$('#zipMail'); if(zm) zm.onclick=()=>exportZip(s,'mail');
  const sa=$('#sendAll'); if(sa) sa.onclick=async()=>{ if(zipBusy||sa.disabled) return; sa.disabled=true;
    const m=$('#zipMsg'); if(m){ m.hidden=false; m.textContent='Sheet рүү илгээж байна…'; m.style.color='var(--ok)'; }
    try{ await syncAll(false); await exportZip(s,'mail'); } finally{ const b=$('#sendAll'); if(b) b.disabled=false; } };
  const zs=$('#zipShare'); if(zs) zs.onclick=()=>exportZip(s,'share');
  const ds=$('#delSurvey'); if(ds) ds.onclick=()=>deleteSurvey(s, $('#delSZone'));
  const fin=$('#finish'); if(fin) fin.onclick=()=>{ const t=dayKey(Date.now());
    $('#finZone').innerHTML=`<div class="notice" style="border-left-color:var(--leaf)">“${esc(s.name)}” судалгааг дуусгах уу? Дуусах огноо <b>${dfmt(t)}</b> гэж бичигдэнэ. Дараа нь шинэ үзлэг хийхгүй (хэрэгтэй бол дахин нээж болно).
      <div class="row" style="margin-top:10px"><button class="btn small" id="finY" style="background:var(--leaf)">Тийм, дуусгах</button><button class="btn ghost small" id="finN">Болих</button></div></div>`;
    $('#finZone').scrollIntoView({behavior:'smooth',block:'center'});
    $('#finY').onclick=()=>{ s.end=t; save(K.surveys,surveys); toast('Судалгаа дууслаа. ZIP-ээ илгээхээ мартуузай.'); render(); };
    $('#finN').onclick=()=>{ $('#finZone').innerHTML=''; }; };
  const ro=$('#reopen'); if(ro) ro.onclick=()=>{ s.end=''; save(K.surveys,surveys); toast('Судалгаа дахин нээгдлээ'); render(); };
  document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startInspection(b.dataset.start, s.id));
  bindCommon();
  const pc=$('#pickCars'); if(pc) pc.onclick=()=>go({name:'surveyForm', id:s.id});
}

/* ---- 2 удаа асууж баталгаажуулах ---- */
function confirmN(zone, qs, yesLabel, onYes, k=0){
  const last=k===qs.length-1, tag=k?`<b>${k+1}/${qs.length}. Дахин асууж байна:</b> `:(qs.length>1?`<b>1/${qs.length}.</b> `:'');
  zone.innerHTML=`<div class="notice" style="border-left-color:var(--bad)">${tag}${qs[k]}
    <div class="row" style="margin-top:10px"><button type="button" class="btn danger small" id="cnYes">${last?yesLabel:'Тийм'}</button><button type="button" class="btn ghost small" id="cnNo">Болих</button></div></div>`;
  zone.querySelector('#cnNo').onclick=()=>render();
  zone.querySelector('#cnYes').onclick=()=> last ? onYes() : confirmN(zone, qs, yesLabel, onYes, k+1);
  zone.scrollIntoView({behavior:'smooth', block:'center'});
}
const confirm2=(zone,q1,q2,yes,onYes)=>confirmN(zone,[q1,q2],yes,onYes);
function deleteSurvey(s, zone){
  const n=inspections.filter(i=>i.surveyId===s.id).length;
  confirmN(zone, [`“${esc(s.name)}” судалгааг устгах уу? Түүний ${n} үзлэг мөн устна. Машинууд “Машинууд” жагсаалтад үлдэнэ.`,
    `Sheet рүү илгээгээгүй үзлэг байвал алга болно. Эхлээд “Бүх датаг илгээх” дарсан уу? Үргэлжлүүлэх үү?`,
    `“${esc(s.name)}” судалгаа, ${n} үзлэгийг бүр мөсөн устгах уу? Буцаах боломжгүй.`], 'Тийм, бүр мөсөн устгах',
    ()=>{ surveys=surveys.filter(x=>x.id!==s.id); inspections=inspections.filter(i=>i.surveyId!==s.id); save(K.surveys,surveys); save(K.insp,inspections); sDraft=null; toast('Судалгаа устгагдлаа'); go({name:'home',tab:'surveys'}); });
}

/* ---- GPS: үзлэг хийсэн газрын координат ---- */
function locate(d){
  if(!('geolocation' in navigator)){ d.geoState='none'; return; }
  if(d.geoState==='busy') return; d.geoState='busy'; geoUi();
  navigator.geolocation.getCurrentPosition(p=>{
    const c=p.coords; const g={lat:+c.latitude.toFixed(6), lng:+c.longitude.toFixed(6), acc:Math.round(c.accuracy||0), at:p.timestamp||Date.now()};
    if(!d.geo || g.acc<=d.geo.acc || g.at-d.geo.at>120000) d.geo=g; d.geoState='ok'; geoUi();
  }, e=>{ d.geoState = e.code===1 ? 'denied' : (d.geo?'ok':'fail'); geoUi(); }, {enableHighAccuracy:true, timeout:20000, maximumAge:60000});
}
function geoText(d){
  if(d.geo) return `📍 Байршил авлаа: ${d.geo.lat}, ${d.geo.lng}${d.geo.acc?` (±${d.geo.acc} м)`:''}`;
  return {busy:'📍 Байршил тогтоож байна…', denied:'📍 Байршлын зөвшөөрөл өгөөгүй. Тохиргоо → Safari/Chrome → Байршил (Location)-ыг зөвшөөрнө үү.', fail:'📍 Байршил олдсонгүй.', none:'📍 Энэ утас байршил дэмжихгүй.'}[d.geoState]||'';
}
function geoUi(){ const el=$('#geo'); if(el && draft){ el.textContent=geoText(draft); el.dataset.ok=draft.geo?'1':''; const r=$('#geoRetry'); if(r) r.hidden=!!draft.geo||draft.geoState==='busy'; } }
const mapLink = g => g ? `https://maps.google.com/?q=${g.lat},${g.lng}` : '';

/* ---- inspection detail ---- */
function report(i){
  const bad=i.items.filter(x=>x.s==='bad');
  const L=['BRCC · Биологийн Нөөцийг Хамгаалах Төв', `${(surveyOf(i.surveyId)||{name:'Машины үзлэг'}).name}`, `Машин: ${i.plate}${i.car?' ('+i.car+')':''}`, `Жолооч: ${i.driver}`, `Огноо: ${fmt(i.at)}`];
  if(i.odo) L.push(`Гүйлт: ${i.odo} км`); if(i.fuel) L.push(`Түлш: ${i.fuel}`);
  if(i.geo) L.push(`Байршил: ${i.geo.lat}, ${i.geo.lng} (${mapLink(i.geo)})`);
  L.push(bad.length?`Хэвийн бус (${bad.length}):`:'Бүх зүйл хэвийн.');
  bad.forEach(x=>{ const it=ITEMS.find(t=>t.id===x.id); L.push(`- ${it?it.t:x.id}: ${x.note}`); });
  return L.join('\n');
}

  const bad=i.items.filter(x=>x.s==='bad');
  let h=`<div class="selfie-box" style="border-style:solid;border-color:var(--line)"><img src="${i.selfie}" alt="Жолоочийн селфи"></div>
    <div class="form"><dl class="kv">

      <dt>Жолооч</dt><dd>${esc(i.driver)}</dd>
      <dt>Огноо</dt><dd>${fmt(i.at)}</dd>
      ${i.odo?`<dt>Гүйлт</dt><dd>${esc(i.odo)} км</dd>`:''}${i.fuel?`<dt>Түлш</dt><dd>${esc(i.fuel)}</dd>`:''}
      ${i.geo?`<dt>Байршил</dt><dd><a href="${mapLink(i.geo)}" target="_blank" rel="noopener">${i.geo.lat}, ${i.geo.lng}</a>${i.geo.acc?` <span style="color:var(--muted)">±${i.geo.acc} м</span>`:''}</dd>`:''}
      <dt>Sheet</dt><dd>${i.synced?'<span class="pill ok">Илгээгдсэн</span>':`<span class="pill todo">${syncing?'Илгээж байна…':'Илгээгдээгүй'}</span>`}</dd>
      <dt>Дүн</dt><dd>${bad.length?`<span class="pill bad">${bad.length} хэвийн бус</span>`:`<span class="pill ok">Бүх ${i.items.length} зүйл хэвийн</span>`}</dd></dl></div>`;
  if(bad.length){ h+=`<h2>Хэвийн бус зүйлс</h2><div class="badlist">`+bad.map(x=>{ const it=ITEMS.find(t=>t.id===x.id);
    return `<div class="b"><strong>${esc(it?it.t:x.id)}</strong><div>${esc(x.note)}</div>${x.photo?`<img class="thumb" style="margin-top:8px;width:120px;height:120px" src="${x.photo}" alt="Гэмтлийн зураг">`:''}</div>`; }).join('')+`</div>`; }
  h+=`<div id="delZone"><button class="btn ghost small" id="delI" style="color:var(--bad)">Энэ үзлэгийг устгах</button></div>`;
  $('#app').innerHTML=h;
  foot(`<button class="btn ghost" id="copy" style="flex:1">Тайлан хуулах</button><button class="btn" id="home" style="flex:1">Судалгаа руу</button>`);
  $('#home').onclick=()=>toSurvey(i.surveyId);
  $('#copy').onclick=()=>{ const txt=report(i); navigator.clipboard.writeText(txt).then(()=>toast('Тайлан хуулагдлаа. Чат руу буулгана уу.'),()=>{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.minHeight='180px'; $('#app').appendChild(ta); ta.select(); toast('Текстийг сонгоод хуулна уу.'); }); };
  $('#delI').onclick=()=>confirm2($('#delZone'), 'Энэ үзлэгийг устгах уу?', `${esc(i.plate)} · ${fmt(i.at)} үзлэгийг бүр мөсөн устгах уу? Буцаах боломжгүй.`, 'Тийм, устгах',
    ()=>{ inspections=inspections.filter(x=>x.id!==i.id); save(K.insp,inspections); toast('Устгагдлаа'); toSurvey(i.surveyId,'hist'); });
}

/* ---- Google Sheet sync (Apps Script web app, same pattern as the Saiga app) ---- */
// Байгууллагын Apps Script /exec холбоосыг энд тавьвал бүх утсанд автоматаар тохирно.
const DEFAULT_SHEET_URL = 'https://script.google.com/macros/s/AKfycbz31DJWRV2pznKr8HxB2cNEaYb3NfzdYFDjUdjA9FIDxR1xksR9lGGWxHUChyYm0ySL/exec';
const K_URL='vi.sheetUrl';
try{ if((localStorage.getItem(K_URL)||'').includes('AKfycbzp4TRahPxv-kHNSSEQfEFHoLsBIL-BcDRolZ-dOqI04QPyDvMqECa-NbbGZXpWTzP4')) localStorage.removeItem(K_URL); }catch(_){}
const sheetUrl = () => (load(K_URL,'')||DEFAULT_SHEET_URL).trim();
let syncing=false, syncMsg='', lastSync=load('vi.lastSync',0);
const pending = () => inspections.filter(i=>!i.synced).length;
async function post(url, payload, ms=90000){
  const ac=new AbortController(); const timer=setTimeout(()=>ac.abort(), ms); let j;
  let res;
  try{ res=await fetch(url,{method:'POST', body:JSON.stringify(payload), headers:{'Content-Type':'text/plain;charset=utf-8'}, redirect:'follow', signal:ac.signal}); }
  catch(e){ clearTimeout(timer); throw ac.signal.aborted ? new Error('Хариу ирсэнгүй (хугацаа хэтэрлээ)') : new Error(navigator.onLine?'Google скрипт хариу өгсөнгүй. Deploy-н “Who has access” нь “Anyone” эсэхийг шалгана уу':'Интернэт алга'); }
  try{ const t=await res.text(); try{ j=JSON.parse(t); }catch(_){ throw new Error(/doGet|doPost|function/i.test(t)?'Скриптийн код бүрэн хуулагдаагүй байна':'Скрипт JSON биш хариу өгсөн (эрх эсвэл Deploy тохиргоо буруу)'); } }
  catch(e){ throw e; }
  finally{ clearTimeout(timer); }
  if(!j.ok) throw new Error(j.error||'Sheet алдаа'); return j;
}
function thumb(src, max=240){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.7)); }; img.onerror=()=>res(src); img.src=src; }); }
const sheetName = n => String(n||'Бусад').replace(/[\[\]\*\?\/\\:]/g,' ').trim().slice(0,99)||'Бусад';
function headers(){ return ['id','Огноо','Цаг','Судалгаа','Улсын дугаар','Машин','Жолооч','Гүйлт (км)','Түлш','Дүн', ...ITEMS.map(t=>t.t), 'Хэвийн бус тайлбар','Селфи','Гэмтлийн зураг','Өргөрөг','Уртраг','Нарийвчлал (м)','Газрын зураг']; }
function sheetRow(i, s){
  const bad=i.items.filter(x=>x.s==='bad'); const d=new Date(i.at);
  const r={'id':i.id, 'Огноо':dayKey(i.at), 'Цаг':String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'), 'Судалгаа':s.name, 'Улсын дугаар':i.plate, 'Машин':i.car||'', 'Жолооч':i.driver,
    'Гүйлт (км)':i.odo||'', 'Түлш':i.fuel||'', 'Дүн':bad.length?bad.length+' хэвийн бус':'Хэвийн',
    'Хэвийн бус тайлбар':bad.map(x=>{ const it=ITEMS.find(t=>t.id===x.id); return (it?it.t:x.id)+': '+x.note; }).join('\n'),
    'Селфи':i.selfieLink||'', 'Гэмтлийн зураг':i.items.filter(x=>x.photoLink).map(x=>x.photoLink).join('\n'),
    'Өргөрөг':i.geo?String(i.geo.lat):'', 'Уртраг':i.geo?String(i.geo.lng):'', 'Нарийвчлал (м)':i.geo&&i.geo.acc?String(i.geo.acc):'', 'Газрын зураг':mapLink(i.geo)};
  ITEMS.forEach(t=>{ const x=i.items.find(y=>y.id===t.id); r[t.t]= !x||!x.s ? '' : x.s==='ok' ? 'Хэвийн' : 'Хэвийн бус: '+x.note; });
  return r;
}
function mailBody(i){
  const L=[report(i), ''];
  if(i.selfieLink) L.push('Селфи: '+i.selfieLink);
  i.items.filter(x=>x.photoLink).forEach(x=>{ const it=ITEMS.find(t=>t.id===x.id); L.push((it?it.t:x.id)+' зураг: '+x.photoLink); });
  return L.join('\n');
}
async function syncAll(manual){
  const url=sheetUrl();
  if(!url){ if(manual) toast('Эхлээд Google Sheet холбоосоо оруулна уу.'); return; }
  if(syncing) return;
  if(!navigator.onLine){ if(manual) toast('Интернэт алга. Сүлжээнд орохоор автоматаар илгээнэ.'); return; }
  const todo=inspections.filter(i=>!i.synced); if(!todo.length){ if(manual) toast('Илгээх үзлэг алга.'); return; }
  syncing=true; syncMsg='Илгээж байна…'; refreshSync(); let n=0;
  try{
    for(const i of todo){
      if(!inspections.includes(i)) continue; // илгээх хооронд устгагдсан
      const s=surveyOf(i.surveyId)||{name:'Бусад'};
      const base=`${dayKey(i.at)}_${i.plate.replace(/\s+/g,'')}_${i.id.slice(-5)}`;
      if(i.selfie && !i.selfieLink){ const j=await post(url,{action:'photo', folder:s.name, name:base+'_selfie.jpg', mime:'image/jpeg', caption:`${i.plate} · ${i.driver} · ${fmt(i.at)}`, data:i.selfie.split(',')[1]}); i.selfieLink=j.url; save(K.insp,inspections); }
      for(const x of i.items){ if(x.photo && !x.photoLink){ const it=ITEMS.find(t=>t.id===x.id); const j=await post(url,{action:'photo', folder:s.name, name:base+'_'+x.id+'.jpg', mime:'image/jpeg', caption:(it?it.t:x.id)+': '+x.note, data:x.photo.split(',')[1]}); x.photoLink=j.url; save(K.insp,inspections); } }
      await post(url,{action:'upsert', sheet:sheetName(s.name), headers:headers(), key:'id', rows:[sheetRow(i,s)]});
      if(!i.mailed){ const bad=i.items.filter(x=>x.s==='bad').length;
        await post(url,{action:'notify', bad, subject:`Машины үзлэг: ${i.plate} · ${dayKey(i.at).replace(/-/g,'.')}${bad?' · '+bad+' хэвийн бус':' · хэвийн'}`, body:mailBody(i)}); i.mailed=true; }
      i.synced=true;
      // Бүтэн зураг Drive-д хадгалагдсан тул утсанд жижиг хувийг үлдээнэ (санах ой дүүрэхээс сэргийлнэ)
      if(i.selfie) i.selfie=await thumb(i.selfie, 320);
      for(const x of i.items) if(x.photo) x.photo=await thumb(x.photo, 240);
      save(K.insp,inspections); n++;
    }
    lastSync=Date.now(); save('vi.lastSync',lastSync); syncMsg=n?`${n} үзлэг Sheet-д илгээгдлээ.`:'';
    if(manual&&n) toast(syncMsg);
  }catch(e){ syncMsg='Илгээж чадсангүй: '+e.message+'. Дараа дахин оролдоно.'; if(manual) toast(syncMsg); }
  finally{ syncing=false; save(K.insp,inspections); refreshSync(); }
}
function refreshSync(){ if((view.name==='home' && view.tab==='settings') || view.name==='detail'){ const y=window.scrollY; render(); window.scrollTo(0,y); } else if(view.name==='home'){ render(); } }
function syncBanner(){
  const p=pending(); if(!sheetUrl()) return `<button class="notice" data-tab="settings" style="text-align:left;border-left-color:var(--warn)">Google Sheet холбогдоогүй. Үзлэгүүд зөвхөн энэ утсанд хадгалагдаж байна. <u>Тохируулах</u></button>`;
  if(syncing) return `<div class="notice">☁ Sheet рүү илгээж байна…</div>`;
  if(p) return `<button class="notice" data-tab="settings" style="text-align:left;border-left-color:var(--warn)">☁ ${p} үзлэг Sheet рүү илгээгдээгүй. ${navigator.onLine?'':'Интернэт ороход автоматаар илгээнэ. '}<u>Дэлгэрэнгүй</u></button>`;
  return '';
}
function renderSettings(){
  const p=pending(); const url=sheetUrl();
  return `<div class="form">
    <h2 style="margin:0">Google Sheet ба имэйл</h2>
    <div class="notice" style="border-left-color:${url?(p?'var(--warn)':'var(--ok)'):'var(--warn)'}">${url?(p?`${p} үзлэг илгээгдээгүй байна.`:'Бүх үзлэг Sheet-д илгээгдсэн.'):'Холбоос оруулаагүй байна.'}
      ${lastSync?`<br><span style="color:var(--muted)">Сүүлд илгээсэн: ${fmt(lastSync)}</span>`:''}${syncMsg?`<br>${esc(syncMsg)}`:''}</div>
    <div class="field"><label for="surl">Apps Script холбоос (/exec)</label>
      <input type="url" id="surl" value="${esc(load(K_URL,'')||'')}" placeholder="${DEFAULT_SHEET_URL?'Байгууллагын холбоос ашиглаж байна':'https://script.google.com/macros/s/…/exec'}" autocomplete="off" autocapitalize="off" spellcheck="false">
      <span class="hint">Үзлэг бүр Sheet-ийн судалгааны нэртэй хуудсанд мөр болж орно. Селфи, гэмтлийн зураг Drive-ийн “Машины үзлэг зураг” хавтсанд хадгалагдана. Хэвийн бус зүйлтэй үзлэгийг data.brcc@gmail.com руу имэйлээр мэдэгдэнэ.</span></div>
    <div class="row"><button class="btn ghost small" id="stest">Шалгах</button><button class="btn small" id="ssave">Хадгалах</button><button class="btn ghost small" id="snow" ${url&&p&&!syncing?'':'disabled'}>Одоо илгээх</button></div>
    <div class="err" id="smsg" hidden></div>
  </div>
  <div class="form">
    <h2 style="margin:0">Утсандаа суулгах</h2>
    <div style="font-size:14.5px;line-height:1.5"><b>iPhone:</b> Safari-гаар нээгээд доорх <b>Share ⬆</b> → <b>Add to Home Screen</b>.<br>
    <b>Android:</b> Chrome-оор нээгээд <b>⋮</b> → <b>Install app</b> (эсвэл Add to Home screen).<br>
    <span style="color:var(--muted)">Суулгасны дараа зөвхөн нүүр дэлгэцийн айконоос нээнэ үү. iPhone дээр Safari доторх өгөгдөл ба суулгасан апп тусдаа хадгалагддаг.</span></div>
  </div>`;
}
function bindSettings(){
  const msg=(t,ok)=>{ const m=$('#smsg'); m.hidden=false; m.textContent=t; m.style.color=ok?'var(--ok)':''; };
  const val=()=>$('#surl').value.trim();
  const valid=u=>!u || /^https:\/\/script\.google(usercontent)?\.com\/.+/.test(u);
  $('#ssave').onclick=()=>{ const u=val(); if(!valid(u)) return msg('Холбоос https://script.google.com/… гэж эхлэх ёстой.'); save(K_URL,u); toast(u?'Хадгалагдлаа':'Холбоосыг устгалаа'); syncAll(); render(); };
  $('#stest').onclick=async()=>{ const u=val()||DEFAULT_SHEET_URL; if(!u||!valid(u)) return msg('Зөв холбоос оруулна уу.'); msg('Шалгаж байна…',true);
    try{ const j=await post(u,{action:'ping'},30000); msg(`Холбогдлоо: “${j.sheet}” Sheet.`,true); }catch(e){ msg('Холбогдсонгүй: '+e.message); } };
  $('#snow').onclick=()=>syncAll(true);
}
/* ---- Survey export: one ZIP (CSV table + text report + photos), by email via Apps Script or saved/shared on the phone ---- */
function loadJSZip(){ return window.JSZip ? Promise.resolve(window.JSZip) : new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='js/jszip.min.js'; sc.onload=()=>res(window.JSZip); sc.onerror=()=>rej(new Error('ZIP сан ачаалсангүй')); document.head.appendChild(sc); }); }
const csvCell = v => { const t=String(v??''); return /[",\n;]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t; };
async function buildZip(s){
  const JSZip=await loadJSZip(); const zip=new JSZip();
  const list=inspections.filter(i=>i.surveyId===s.id).sort((a,b)=>a.at-b.at);
  const H=headers(); const rows=[H.map(csvCell).join(',')];
  const rep=[`BRCC · Биологийн Нөөцийг Хамгаалах Төв`, `Судалгаа: ${s.name}`, `Хугацаа: ${dateRange(s)}`, `Нийт үзлэг: ${list.length}`, ''];
  for(const i of list){
    const r=sheetRow(i,s); rows.push(H.map(h=>csvCell(r[h])).join(','));
    rep.push('------------------------------', report(i), '');
    const base=`${dayKey(i.at)}_${(i.plate.match(/\d+/)||['car'])[0]}_${i.id.slice(-5)}`; // ASCII names: open cleanly on every computer
    if(i.selfie && i.selfie.startsWith('data:')) zip.file(`photos/${base}_selfie.jpg`, i.selfie.split(',')[1], {base64:true});
    for(const x of i.items) if(x.photo && x.photo.startsWith('data:')) zip.file(`photos/${base}_${x.id}.jpg`, x.photo.split(',')[1], {base64:true});
  }
  zip.file('uzleg.csv', '﻿'+rows.join('\r\n'));
  zip.file('tailan.txt', rep.join('\r\n'));
  const name=`${sheetName(s.name).replace(/\s+/g,'_')}_${dayKey(Date.now())}.zip`;
  return {zip, name, count:list.length};
}
let zipBusy=false;
async function exportZip(s, mode){
  if(zipBusy) return; const msg=$('#zipMsg'); const say=(t,ok)=>{ if(msg){ msg.hidden=false; msg.textContent=t; msg.style.color=ok?'var(--ok)':''; } };
  zipBusy=true; say('ZIP бэлдэж байна…',true);
  try{
    const {zip,name,count}=await buildZip(s);
    if(mode==='mail'){
      const url=sheetUrl();
      if(!url){ say('Имэйлээр илгээхэд Google Sheet холбоос хэрэгтэй (Тохиргоо). Одоохондоо “утсанд хадгалах” товчоор авна уу.'); return; }
      if(!navigator.onLine){ say('Интернэт алга. Сүлжээнд орсон хойноо дахин дарна уу.'); return; }
      say('Имэйлээр илгээж байна… (зураг ихтэй бол хэдэн минут болно)',true);
      const data=await zip.generateAsync({type:'base64'});
      const body=`BRCC · Биологийн Нөөцийг Хамгаалах Төв\nСудалгаа: ${s.name}\nХугацаа: ${dateRange(s)}\nНийт үзлэг: ${count}\n\nZIP дотор: uzleg.csv (Excel-ээр нээнэ), tailan.txt (тайлан), photos/ (селфи, гэмтлийн зураг).`;
      const j=await post(url,{action:'email', name, folder:s.name, subject:`Машины үзлэг: ${s.name} (${dateRange(s)})`, body, data}, 300000);
      say(`Илгээгдлээ: ${j.to||'data.brcc@gmail.com'}`,true); toast('ZIP имэйлээр илгээгдлээ');
    } else {
      const blob=await zip.generateAsync({type:'blob'}); const file=new File([blob], name, {type:'application/zip'});
      if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title:name}); say('Бэлэн боллоо.',true); return; }catch(e){ if(e.name==='AbortError'){ say(''); msg&&(msg.hidden=true); return; } } }
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000);
      say('ZIP татагдлаа.',true);
    }
  }catch(e){ say('Амжилтгүй: '+e.message); }
  finally{ zipBusy=false; }
}
window.addEventListener('online', ()=>syncAll());
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') syncAll(); });
setInterval(()=>syncAll(), 120000);
setTimeout(()=>syncAll(), 1500);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

render();
